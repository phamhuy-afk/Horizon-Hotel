name: Quanlyks Docker CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build PHP Docker image
        run: docker build -t quanlyks-web:ci .

      - name: Check PHP syntax
        run: |
          docker run --rm quanlyks-web:ci php -l index.php
          docker run --rm quanlyks-web:ci php -l config/Database.php
